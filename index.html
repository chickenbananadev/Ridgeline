<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#20242A" />
    <title>RoofStride — Roofing CRM Built for Roofing. Made to Move.</title>
    <meta name="description" content="RoofStride is the all-in-one roofing CRM: pipeline, estimates and proposals, insurance-claim and supplement tools, storm and code lookup, scheduling, and payments — built for roofing contractors." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://roofstride.com/" />
    <!-- Rich link preview (iMessage, Slack, social). The gray second line in
         iMessage is the domain itself and can't be replaced by meta — the
         tagline lives in the card image, title and description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Built for Roofing. Made to Move." />
    <meta property="og:title" content="RoofStride" />
    <meta property="og:description" content="Built for Roofing. Made to Move." />
    <meta property="og:url" content="https://roofstride.com/" />
    <meta property="og:image" content="https://roofstride.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RoofStride — Built for Roofing. Made to Move." />
    <meta name="twitter:description" content="Built for Roofing. Made to Move." />
    <meta name="twitter:image" content="https://roofstride.com/og-image.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Theme tokens. The app's neutral colors (S.*) resolve to these CSS
         variables, so flipping data-theme on <html> repaints the whole app
         with no re-render. Light by default; follows the OS until the user
         picks a theme (which stamps data-theme and persists it). Printed
         documents and the client portal are pinned light elsewhere. -->
    <style>
      :root {
        --rl-bg:#F7F8FA; --rl-card:#FFFFFF; --rl-soft:#F3F4F6;
        --rl-line:#E5E7EB; --rl-ink:#111827; --rl-sub:#6B7280;
        /* Tinted tone pairs (Chip/Callout/status pills) — pale bg + readable fg,
           each half tuned per theme so status colors never wash out or clip. */
        --rl-gray-bg:#F3F4F6; --rl-gray-fg:#374151;
        --rl-green-bg:#E8F6EE; --rl-green-fg:#177245;
        --rl-red-bg:#FDECEC; --rl-red-fg:#B42318;
        --rl-amber-bg:#FDF4E3; --rl-amber-fg:#92600A;
        --rl-slate-bg:#E9EDEF;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --rl-bg:#0F1216; --rl-card:#171B21; --rl-soft:#1F242B;
          --rl-line:#2A2F37; --rl-ink:#E7EAEE; --rl-sub:#9BA3AE;
          --rl-gray-bg:#262B33; --rl-gray-fg:#C7CCD6;
          --rl-green-bg:#123524; --rl-green-fg:#4ADE9A;
          --rl-red-bg:#3A1414; --rl-red-fg:#FF9187;
          --rl-amber-bg:#3A2A0A; --rl-amber-fg:#F5C36B;
          --rl-slate-bg:#2A2F37;
        }
      }
      :root[data-theme="dark"], [data-theme="dark"] {
        --rl-bg:#0F1216; --rl-card:#171B21; --rl-soft:#1F242B;
        --rl-line:#2A2F37; --rl-ink:#E7EAEE; --rl-sub:#9BA3AE;
        --rl-gray-bg:#262B33; --rl-gray-fg:#C7CCD6;
        --rl-green-bg:#123524; --rl-green-fg:#4ADE9A;
        --rl-red-bg:#3A1414; --rl-red-fg:#FF9187;
        --rl-amber-bg:#3A2A0A; --rl-amber-fg:#F5C36B;
        --rl-slate-bg:#2A2F37;
      }
      /* App shell. The bottom nav used to be position:fixed over a normally
         scrolling document, which is exactly the arrangement iOS Safari
         mishandles: as its toolbar collapses and expands during a scroll
         gesture, fixed elements are only re-laid-out at gesture end, so the
         bar visibly detaches and drifts up the page mid-scroll.

         Instead the shell is a fixed-height flex column and the screens
         scroll inside their own pane, which makes the nav an ordinary flex
         child that cannot move. dvh tracks the visible viewport as the
         toolbar animates; the vh above it is the fallback for browsers
         without dvh. */
      .rl-shell { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
      .rl-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }

      /* PULL-TO-REFRESH KILLS THE CANVASSING MAP.

         A rep drags DOWN on a full-screen map to pan north. iOS reads
         that as a pull-to-refresh on the document, claims the gesture,
         and reloads the app — so the map "won't drag" and the page
         "refreshes", which is exactly one bug wearing two faces.

         `touch-action: none` on the map is not enough: Safari has long
         triggered the refresh regardless. Suppressing overscroll at the
         document level is the fix that actually holds. The shell never
         scrolls anyway (it is a fixed-height flex column) — this only
         removes the browser's rubber-band and refresh on top of it. */
      html, body { overscroll-behavior: none; }
      /* No touch-action here, deliberately. It briefly said
         `touch-action: none`, which reads as "the map owns its
         gestures" but actually governs EVERY touch that starts
         anywhere inside the wrapper — including the pin bottom sheet,
         which scrolls, and stopped scrolling under that rule
         (effective touch-action is intersected down the ancestor
         chain). Leaflet already sets touch-action on its own container
         — that's how every Leaflet page owns its map gestures — and
         the pull-to-refresh fix is the html/body rule above, not this
         one. */
      .rl-map { overscroll-behavior: none; }
      [data-theme="light"] {
        --rl-bg:#F7F8FA; --rl-card:#FFFFFF; --rl-soft:#F3F4F6;
        --rl-line:#E5E7EB; --rl-ink:#111827; --rl-sub:#6B7280;
        --rl-gray-bg:#F3F4F6; --rl-gray-fg:#374151;
        --rl-green-bg:#E8F6EE; --rl-green-fg:#177245;
        --rl-red-bg:#FDECEC; --rl-red-fg:#B42318;
        --rl-amber-bg:#FDF4E3; --rl-amber-fg:#92600A;
        --rl-slate-bg:#E9EDEF;
      }
    </style>
    <!-- With scripting off, React will never mount, so the pre-mount frame in
         #root would sit there as a permanent full-viewport "Loading…" the
         visitor has to scroll past to reach the <noscript> content below it.
         Hide #root entirely in that case: no-JS agents get the marketing
         markup and nothing else. -->
    <noscript><style>#root { display: none; }</style></noscript>
    <!-- Structured data so search engines understand what RoofStride is and
         how it's priced. Kept in sync with the PRODUCT constants in the app. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://roofstride.com/#org",
          "name": "RoofStride",
          "url": "https://roofstride.com/",
          "slogan": "Built for Roofing. Made to Move.",
          "logo": "https://roofstride.com/apple-touch-icon.png",
          "email": "support@roofstride.com"
        },
        {
          "@type": "SoftwareApplication",
          "name": "RoofStride",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web, iOS, Android",
          "description": "All-in-one roofing CRM for contractors: pipeline, estimates and proposals, insurance-claim and supplement tools, storm and building-code lookup, scheduling, and payments.",
          "url": "https://roofstride.com/",
          "publisher": { "@id": "https://roofstride.com/#org" },
          "offers": [
            {
              "@type": "Offer",
              "name": "RoofStride base plan",
              "price": "119.99",
              "priceCurrency": "USD",
              "description": "Up to 10 seats. 7-day free trial."
            },
            {
              "@type": "Offer",
              "name": "RoofStride unlimited plan",
              "price": "199.99",
              "priceCurrency": "USD",
              "description": "Unlimited seats. 7-day free trial."
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body style="margin:0">
    <!-- Pre-mount frame. This is what a real visitor sees between the HTML
         parsing and React mounting — on a phone over cellular that is a
         visible beat, not an imperceptible one. It deliberately mirrors the
         app's own boot screen (ridgeline.jsx, the `booting` gate: RoofStride
         mark at 73px on the card background, "Loading…" beneath) so the
         handoff to React is a continuation rather than a change of screen.
         React replaces this entire subtree on mount.

         The marketing copy that used to live here moved into <noscript>
         below: it was flashing full-page for a second on every cold load
         before the app appeared. It stays in the raw HTML for crawlers and
         link unfurlers — which read the served markup, not the painted
         page — and it still renders for a genuinely JS-less visitor, but a
         real user never sees it. -->
    <div id="root">
      <div style="min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--rl-card);font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
        <div style="text-align:center">
          <img src="/icon-512.png" alt="RoofStride" width="73" height="73" style="width:73px;height:73px;border-radius:16px;object-fit:contain;margin:0 auto 14px;display:block" />
          <div style="font-size:14px;color:var(--rl-sub)">Loading…</div>
        </div>
      </div>
    </div>
    <noscript>
      <main style="max-width:860px;margin:0 auto;padding:48px 24px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#20242A">
        <img src="/icon-512.png" alt="RoofStride" width="56" height="56" style="width:56px;height:56px;border-radius:12px;display:block;margin:0 0 16px" />
        <h1 style="font-size:34px;line-height:1.15;margin:0 0 12px">RoofStride — the roofing CRM built for the field</h1>
        <p style="font-size:18px;color:#5B6470;margin:0 0 24px">Built for Roofing. Made to Move. Run your whole roofing business — leads, estimates, insurance claims, crews, and payments — from one app on the truck or at the kitchen table.</p>
        <h2 style="font-size:22px;margin:28px 0 10px">What RoofStride does</h2>
        <ul style="font-size:16px;line-height:1.7;color:#374151;padding-left:20px;margin:0">
          <li>Sales pipeline and job board for every roof from lead to paid</li>
          <li>Estimates, customer-selectable option tiers, and signable proposals</li>
          <li>Insurance-claim tools: supplement checker, depreciation tracking, and a claim assistant</li>
          <li>Storm history and building-code lookup by address, with Municode links</li>
          <li>Measurement import, material lists, work orders, and subcontractor pay</li>
          <li>Scheduling, weather on every job, invoicing, and payment tracking</li>
        </ul>
        <h2 style="font-size:22px;margin:28px 0 10px">Pricing</h2>
        <p style="font-size:16px;line-height:1.7;color:#374151;margin:0">$119.99/mo including 10 seats, or $199.99/mo for unlimited seats. Start with a 7-day free trial.</p>
        <p style="font-size:16px;margin:28px 0 0"><a href="mailto:support@roofstride.com" style="color:#0A9E98;font-weight:600">Contact us</a> — support@roofstride.com</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
